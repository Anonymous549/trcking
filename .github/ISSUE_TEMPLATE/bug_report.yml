name: Bug Report
description: Report a bug or unexpected behavior in LIFE OS 365
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thank you for helping improve LIFE OS 365. Please do not share sensitive personal journal or finance records."
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Today Dashboard
        2. Tap Quick Actions -> Add Habit
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App Version & Build
      placeholder: "e.g., v1.0.0 (build 10000)"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Android Device & OS Version
      placeholder: "e.g., Pixel 8, Android 15"
