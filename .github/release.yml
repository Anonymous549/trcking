changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot[bot]
  categories:
    - title: "New Modules & Features"
      labels:
        - feature
        - enhancement
    - title: "UI & Experience"
      labels:
        - ui
        - design
        - accessibility
    - title: "Bug Fixes & Stability"
      labels:
        - bug
        - fix
    - title: "Privacy & Security"
      labels:
        - security
        - privacy
    - title: "Documentation & Maintenance"
      labels:
        - documentation
        - ci
        - dependencies
    - title: "Other Changes"
      labels:
        - "*"
